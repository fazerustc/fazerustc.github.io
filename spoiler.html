<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/spoiler.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-sky-200">
<a href="/" class="home"><img class="home-icon" src="assets/home.png"/></a>
<div class="flex justify-center text-center w-full gap-4 text-8xl mb-4">
    <p>Spoiler</p>
</div>
<div class="flex justify-center text-center w-full gap-4 text-xl">
    <p>Make spoiler text for posting on discord</p>
</div>
<div class="flex">
    <input
        type="text"
        id="spoilerText"
        placeholder="Words to spoiler"
        class="w-1/2 relative flex items-center p-1 bg-white border border-gray-200 rounded-xl shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100 transition-all duration-200 mr-1"
    >
    <button
        id="submit"
        type="button"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-lg shadow-sm transition-colors duration-200 whitespace-nowrap mr-1"
    >
        Go!
    </button>
</div>
<table class="table-fixed relative w-full text-left" id="table">
    <tbody></tbody>
</table>
</body>
</html>
